name: Build SolidCraft APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Rust & WASM
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown

      - name: Install Trunk & Image Tools
        run: |
          cargo install --locked trunk
          sudo apt-get update && sudo apt-get install -y imagemagick

      # 1. خفض قيود الرسوميات (WGPU) بأمان تام فقط داخل كود SolidCraft دون المساس بـ Cargo Registry
      - name: Patch SolidCraft GPU Limits
        run: |
          echo "Patching WGPU texture limit to 4096 in solidcraft codebase..."
          # استبدال أي إشارات صريحة لأبعاد 8192 بـ 4096 داخل المشروع فقط
          find apps crates -type f -name "*.rs" -exec sed -i 's/8192/4096/g' {} + || true
          
          # فرض حدود downlevel_defaults الداعمة للموبايل داخل كود الويب
          python3 -c '
          import os, glob
          for path in glob.glob("apps/solidcraft-web/src/**/*.rs", recursive=True):
              with open(path, "r") as f:
                  content = f.read()
              if "wgpu_options" in content or "WebOptions" in content or "eframe::WebRunner" in content:
                  content = content.replace("wgpu::Limits::default()", "wgpu::Limits::downlevel_defaults()")
                  content = content.replace("wgpu::Limits::downlevel_webgl2_defaults()", "wgpu::Limits::downlevel_defaults()")
                  with open(path, "w") as f:
                      f.write(content)
                  print(f"Patched: {path}")
          '

      # 2. بناء حزمة الويب لـ SolidCraft
      - name: Build Web Bundle
        env:
          RUSTFLAGS: "-A warnings"
        run: |
          if [ -d "apps/solidcraft-web" ]; then
            cd apps/solidcraft-web
          elif [ -d "apps/web" ]; then
            cd apps/web
          elif [ -d "apps/solidcraft" ]; then
            cd apps/solidcraft
          fi
          trunk build --release
          cd "$GITHUB_WORKSPACE"
          mkdir -p www
          if [ -d "dist/web" ]; then
            cp -r dist/web/* www/
          elif [ -d "apps/solidcraft-web/dist" ]; then
            cp -r apps/solidcraft-web/dist/* www/
          elif [ -d "dist" ]; then
            cp -r dist/* www/
          fi

      # 3. إعداد Capacitor للأندرويد
      - name: Setup Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "SolidCraft" "com.craft.solidcraft" --web-dir "www"
          npx cap add android
          npx cap sync android

      # 4. تفعيل التسريع العتادي والـ Large Heap لدعم الـ 3D المعقد
      - name: Enable Hardware Acceleration & Optimize memory
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<application /<application android:hardwareAccelerated="true" android:largeHeap="true" /g' "$MANIFEST"

      # 5. استبدال وتجهيز الأيقونة الأصلية
      - name: Enforce SolidCraft Official Icon
        run: |
          ICON_SRC=""
          if [ -f "packaging/solidcraft.png" ]; then
            ICON_SRC="packaging/solidcraft.png"
          elif [ -f "assets/app-icon/icon.png" ]; then
            ICON_SRC="assets/app-icon/icon.png"
          elif [ -f "assets/icon.png" ]; then
            ICON_SRC="assets/icon.png"
          fi

          if [ -n "$ICON_SRC" ]; then
            RES_DIR="android/app/src/main/res"
            rm -rf "$RES_DIR"/mipmap-anydpi-v26
            rm -f "$RES_DIR"/drawable/ic_launcher_background.xml
            rm -f "$RES_DIR"/drawable-v24/ic_launcher_foreground.xml

            for entry in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
              folder="${entry%%:*}"
              size="${entry##*:}"
              mkdir -p "$RES_DIR/mipmap-$folder"
              convert "$ICON_SRC" -resize "${size}x${size}" "$RES_DIR/mipmap-$folder/ic_launcher.png"
              convert "$ICON_SRC" -resize "${size}x${size}" "$RES_DIR/mipmap-$folder/ic_launcher_round.png"
              convert "$ICON_SRC" -resize "${size}x${size}" "$RES_DIR/mipmap-$folder/ic_launcher_foreground.png"
            done
          fi

      # 6. تثبيت اسم التطبيق
      - name: Enforce App Name
        run: |
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">SolidCraft<\/string>/g' android/app/src/main/res/values/strings.xml
          sed -i 's/<string name="title_activity_main">.*<\/string>/<string name="title_activity_main">SolidCraft<\/string>/g' android/app/src/main/res/values/strings.xml

      # 7. حل تعارض كوتلن
      - name: Fix Kotlin Duplicate Classes
        run: |
          cat << 'EOF' >> android/app/build.gradle

          configurations.all {
              resolutionStrategy.eachDependency { DependencyResolveDetails details ->
                  if (details.requested.group == 'org.jetbrains.kotlin') {
                      details.useVersion '1.8.22'
                  }
              }
          }
          dependencies {
              constraints {
                  implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22") {
                      because("align with kotlin-stdlib")
                  }
                  implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22") {
                      because("align with kotlin-stdlib")
                  }
              }
          }
          EOF

      # 8. تجميع الـ APK النهائي
      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 9. رفع الملف للتحميل
      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: SolidCraft-Offline-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

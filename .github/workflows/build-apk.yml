name: Build SolidCraft APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Rust & WASM
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown

      - name: Install Trunk & Image Tools
        run: |
          cargo install --locked trunk ;
          sudo apt-get update && sudo apt-get install -y imagemagick ;

      # التعديل الجراحي: تحميل المكتبات أولاً، ثم تعديل كروت الشاشة في مكتبات الرسوميات فقط
      - name: Targeted GPU Limits Patch
        run: |
          echo "Fetching cargo dependencies..." ;
          cargo fetch --target wasm32-unknown-unknown ;
          
          echo "Patching eframe and wgpu crates for Android GPU compatibility (4096 limits)..." ;
          REGISTRY=$(ls -d /home/runner/.cargo/registry/src/* | head -n 1) ;
          
          for dir in "$REGISTRY"/wgpu* "$REGISTRY"/eframe* "$REGISTRY"/egui_wgpu* ; do
            if [ -d "$dir" ]; then
              echo "Patching limits in: $dir" ;
              find "$dir" -type f -name "*.rs" -exec sed -i 's/8192/4096/g' {} + || true ;
            fi
          done ;
          
          echo "Patching local workspace just in case..." ;
          find apps crates -type f -name "*.rs" -exec sed -i 's/8192/4096/g' {} + || true ;

      # بناء حزمة الويب
      - name: Build Web Bundle
        env:
          RUSTFLAGS: "-A warnings"
        run: |
          TARGET_DIR="." ;
          if [ -d "apps/solidcraft-web" ]; then TARGET_DIR="apps/solidcraft-web";
          elif [ -d "apps/solidcraft" ]; then TARGET_DIR="apps/solidcraft";
          elif [ -d "apps/web" ]; then TARGET_DIR="apps/web"; fi ;
          
          cd "$TARGET_DIR" ;
          trunk build --release ;
          cd "$GITHUB_WORKSPACE" ;
          
          mkdir -p www ;
          if [ -d "$TARGET_DIR/dist/web" ]; then cp -r "$TARGET_DIR/dist/web/"* www/ ;
          elif [ -d "$TARGET_DIR/dist" ]; then cp -r "$TARGET_DIR/dist/"* www/ ;
          else cp -r dist/* www/ || true ; fi ;

      # إعداد Capacitor للأندرويد
      - name: Setup Capacitor
        run: |
          npm init -y ;
          npm install @capacitor/core @capacitor/cli @capacitor/android ;
          npx cap init "SolidCraft" "com.craft.solidcraft" --web-dir "www" ;
          npx cap add android ;
          npx cap sync android ;

      # تفعيل التسريع العتادي
      - name: Enable Hardware Acceleration
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml" ;
          sed -i 's/<application /<application android:hardwareAccelerated="true" android:largeHeap="true" /g' "$MANIFEST" ;

      # استخراج أيقونة التطبيق
      - name: Enforce SolidCraft Official Icon
        run: |
          ICON_SRC="" ;
          if [ -f "packaging/solidcraft.png" ]; then ICON_SRC="packaging/solidcraft.png";
          elif [ -f "assets/app-icon/icon.png" ]; then ICON_SRC="assets/app-icon/icon.png";
          elif [ -f "assets/icon.png" ]; then ICON_SRC="assets/icon.png"; fi ;
          
          if [ -n "$ICON_SRC" ]; then
            RES_DIR="android/app/src/main/res" ;
            rm -rf "$RES_DIR"/mipmap-anydpi-v26 ;
            rm -f "$RES_DIR"/drawable/ic_launcher_background.xml ;
            rm -f "$RES_DIR"/drawable-v24/ic_launcher_foreground.xml ;
            for entry in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
              folder="${entry%%:*}" ;
              size="${entry##*:}" ;
              mkdir -p "$RES_DIR/mipmap-$folder" ;
              convert "$ICON_SRC" -resize "${size}x${size}" "$RES_DIR/mipmap-$folder/ic_launcher.png" ;
              convert "$ICON_SRC" -resize "${size}x${size}" "$RES_DIR/mipmap-$folder/ic_launcher_round.png" ;
              convert "$ICON_SRC" -resize "${size}x${size}" "$RES_DIR/mipmap-$folder/ic_launcher_foreground.png" ;
            done ;
          fi ;

      # تثبيت الاسم في الأندرويد
      - name: Enforce App Name
        run: |
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">SolidCraft<\/string>/g' android/app/src/main/res/values/strings.xml ;
          sed -i 's/<string name="title_activity_main">.*<\/string>/<string name="title_activity_main">SolidCraft<\/string>/g' android/app/src/main/res/values/strings.xml ;

      # حل تعارض كوتلن
      - name: Fix Kotlin Duplicate Classes
        run: |
          echo "configurations.all { resolutionStrategy.eachDependency { DependencyResolveDetails details -> if (details.requested.group == 'org.jetbrains.kotlin') { details.useVersion '1.8.22' } } }" >> android/app/build.gradle ;
          echo "dependencies { constraints { implementation(\"org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22\") { because(\"align with kotlin-stdlib\") } implementation(\"org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22\") { because(\"align with kotlin-stdlib\") } } }" >> android/app/build.gradle ;

      # التجميع وإضافة شهادة التوقيع الرقمية
      - name: Build and Sign Android APK
        run: |
          cd android ;
          chmod +x gradlew ;
          ./gradlew assembleDebug ;
          
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk" ;
          keytool -genkey -v -keystore craft.keystore -alias craft -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Craft, OU=Craft, O=Craft, L=Cairo, S=Cairo, C=EG" ;
          
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" | sort -r | head -n 1) ;
          $APKSIGNER sign --ks craft.keystore --ks-pass pass:123456 --key-pass pass:123456 $APK_PATH ;

      # رفع ملف الـ APK النهائي
      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: SolidCraft-Offline-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
